name: Pylint

# Runs on push to main and OVERHAUL/* branches, and on PRs targeting main.
# Tests against Python 3.12 — the version used in pp_env (production runtime).
on:
  push:
    branches:
      - main
      - 'OVERHAUL/*'
  pull_request:
    branches: [main]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.14
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@f94e3d4742fa10e774bc848f72758dd579428830 # v5.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Analyse code with pylint
        # --fail-under=6.0 blocks merges with critical quality issues;
        # tighten this threshold as code quality improves.
        run: |
          uv run pylint --fail-under=6.0 $(git ls-files '*.py')
