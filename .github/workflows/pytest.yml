name: Pytest Verification

on:
  push:
    branches:
      - main
      - 'OVERHAUL/*'
  pull_request:
    branches:
      - main
      - 'OVERHAUL/*'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Set up Python 3.14
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.14"

    - name: Install uv
      uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
      with:
        enable-cache: true

    - name: Install Dependencies
      run: |
        uv sync --locked --dev

    - name: Run Pytest
      run: |
        # Using the standard test suite execution
        # Environment variables are managed inside tests where applicable
        uv run pytest tests/ --ignore=tests/billing_killswitch/ -v --tb=short
