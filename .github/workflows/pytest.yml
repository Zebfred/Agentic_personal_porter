name: Pytest Verification

on:
  push:
    branches:
      - main
      - 'OVERHAUL/*'
  pull_request:
    branches:
      - main
      - 'OVERHAUL/*'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@d2e2136ccb97bc3924a6043b4c63ff021fa14f61 # v3.1.1
      with:
        auto-activate-base: false
        activate-environment: agentic_porter
        python-version: '3.14'
        
    - name: Install uv
      uses: astral-sh/setup-uv@f94e3d4742fa10e774bc848f72758dd579428830 # v5.3.0
      with:
        enable-cache: true
        
    - name: Install Dependencies
      shell: bash -el {0}
      env:
        UV_PROJECT_ENVIRONMENT: ${{ env.CONDA_PREFIX }}
      run: |
        uv sync --locked --dev
        
    - name: Run Pytest
      shell: bash -el {0}
      run: |
        # Using the standard test suite execution
        # Environment variables are managed inside tests where applicable
        uv run pytest tests/ --ignore=tests/billing_killswitch/ -v --tb=short
